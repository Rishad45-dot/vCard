<style>
  :root{
    --ink:#0B0B0F;
    --muted:#5C5C66;
    --faint:#8B8B95;
    --hair:#E7E7EC;
    --paper:#FFFFFF;
    --accent:#00A85E;
    --accent-ink:#007A44;
    --accent-soft:#E6F6EE;
    --ring:#CFCFD6;
    --shadow:0 18px 50px -24px rgba(11,11,15,.18);
    --radius:16px;
    --font-display:"Space Grotesk","Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
    --font-body:"Manrope","Space Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--font-body);line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  .wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 24px}

  .bg-grid{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
    background-size:44px 44px;opacity:.5;
    -webkit-mask-image:radial-gradient(1200px 700px at 50% 0%,#000 30%,transparent 80%);
    mask-image:radial-gradient(1200px 700px at 50% 0%,#000 30%,transparent 80%);
  }

  /* ===== Section chrome ===== */
  .section{padding:56px 0;border-top:1px solid var(--hair)}
  .section-first{border-top:0;padding:80px 0 56px}
  .sec-head{max-width:640px;margin-bottom:34px}
  .sec-head h2{
    font-family:var(--font-display);font-size:clamp(26px,4.5vw,38px);
    line-height:1.1;margin:0 0 12px;letter-spacing:-.01em;font-weight:700;
  }
  .sec-head p{margin:0;color:var(--muted);font-size:16px}

  /* ===== Contact ===== */
  .contact-list{border:1px solid var(--hair);border-radius:var(--radius);overflow:hidden;background:#fff}
  .contact-row{
    display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
    padding:16px 18px;border-top:1px solid var(--hair);position:relative;
    transition:background .18s ease;
  }
  .contact-row:first-child{border-top:0}
  .contact-row:hover{background:var(--accent-soft)}
  .contact-row:hover .row-icon{border-color:var(--accent);color:var(--accent-ink)}
  .row-icon{
    width:46px;height:46px;border-radius:12px;border:1px solid var(--hair);
    display:grid;place-items:center;color:var(--ink);background:#fff;flex:none;
    transition:.18s ease;
  }
  .row-icon svg{width:22px;height:22px}
  .row-meta{min-width:0}
  .row-meta .lbl{font-size:12.5px;color:var(--faint);font-weight:700;letter-spacing:.01em}
  .row-meta .val{font-size:16px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-display)}
  .row-act{display:flex;align-items:center;gap:8px}
  .row-act .arrow{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);background:#fff;
    display:grid;place-items:center;color:var(--muted);flex:none;transition:.18s ease;
  }
  .row-act .arrow svg{width:17px;height:17px}
  .contact-row:hover .arrow{border-color:var(--accent);color:var(--accent-ink)}
  .copy-btn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);background:#fff;
    display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;
    transition:.18s ease;
  }
  .copy-btn svg{width:16px;height:16px}
  .copy-btn:hover{border-color:var(--accent);color:var(--accent-ink)}

  /* ===== Services ===== */
  .svc-grid{display:grid;grid-template-columns:1fr;gap:16px}
  .svc-card{
    border:1px solid var(--hair);border-radius:var(--radius);background:#fff;
    padding:26px 26px 24px;display:flex;gap:20px;align-items:flex-start;
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .svc-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .svc-num{
    flex:none;width:52px;height:52px;border-radius:14px;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:18px;
  }
  .svc-card h3{font-family:var(--font-display);font-size:20px;margin:2px 0 8px;letter-spacing:-.01em}
  .svc-card p{margin:0;color:var(--muted);font-size:15px}

  /* ===== EV exploration (highlighted) ===== */
  .ev-section{background:linear-gradient(180deg,#F4FBF7,var(--accent-soft));border:1px solid #C9EBD8;border-radius:20px;padding:40px 24px;position:relative;overflow:hidden}
  .ev-flag{
    display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;
    border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;letter-spacing:.02em;
    margin-bottom:22px;
  }
  .ev-flag svg{width:15px;height:15px;flex:none}
  .ev-title{font-family:var(--font-display);font-size:clamp(26px,4.5vw,38px);line-height:1.12;margin:0 0 16px;letter-spacing:-.02em}
  .ev-title .now{color:var(--accent-ink);white-space:nowrap}
  .ev-lede{margin:0 0 30px;color:#3F4A44;font-size:17px;max-width:640px;line-height:1.6}
  .ev-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:30px}
  .ev-card{background:#fff;border:1px solid #D6EEDF;border-radius:14px;padding:20px;display:flex;gap:14px;align-items:flex-start}
  .ev-card .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
  .ev-card .ic svg{width:21px;height:21px}
  .ev-card h4{font-family:var(--font-display);font-size:17px;margin:0 0 6px;letter-spacing:-.01em}
  .ev-card p{margin:0;color:var(--muted);font-size:14.5px}
  .ev-outro{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;border-top:1px solid #D6EEDF;padding-top:22px}
  .ev-outro .txt{font-size:15px;color:#3F4A44;max-width:560px;margin:0}
  .ev-outro .txt b{color:var(--ink)}
  .ev-cta{
    display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:#fff;
    border-radius:999px;padding:13px 20px;font-weight:700;font-size:15px;flex:none;transition:.18s ease;
  }
  .ev-cta svg{width:17px;height:17px}
  .ev-cta:hover{background:var(--accent)}
